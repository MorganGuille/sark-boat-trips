# Runs on every push and every pull request. If anything below fails, GitHub shows a red cross
# next to the commit, so a change that breaks booking, login or the website is caught before it is deployed.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # where the tests keep the throwaway database program (downloaded once, then cached)
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # the same version Heroku runs (see "engines" in package.json)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server tools
        run: npm ci

      - name: Install website tools
        run: cd client && npm ci

      - name: Lint the website code
        run: npm run lint

      - name: Remember the test database program between runs
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Server tests
        run: npm test

      - name: Build the website (as production does)
        run: cd client && npm run build

      - name: Install the browser used by the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (a real browser against the real site)
        run: npm run test:e2e

      - name: Keep the browser test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
